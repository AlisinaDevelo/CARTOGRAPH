name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - "22.x"
          - "24.x"

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Validate release change-control register
        run: npm run change-control:validate

      - name: Test
        run: npm run test:coverage

      - name: Validate roadmap
        run: npm run roadmap:validate && npm run roadmap:test

      - name: Build
        run: npm run build

      - name: Verify package contents
        run: npm pack --dry-run --ignore-scripts --json

      - name: Smoke-test the installed package
        run:
          | # zizmor: ignore[adhoc-packages] Fresh local tarball consumer smoke; lifecycle scripts stay disabled.
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP"
          mkdir "$RUNNER_TEMP/cartograph-consumer"
          cd "$RUNNER_TEMP/cartograph-consumer"
          npm init -y
          npm install --ignore-scripts "$RUNNER_TEMP/cartograph-cli-0.1.0.tgz"
          ./node_modules/.bin/cartograph --version
          ./node_modules/.bin/cartograph scan "$GITHUB_WORKSPACE/test/fixtures/typescript-express" > snapshot.json
          node -e 'const fs = require("node:fs"); const value = JSON.parse(fs.readFileSync("snapshot.json", "utf8")); if (value.schemaVersion !== 1 || value.edges.length === 0) process.exit(1)'
