name: Real-repository benchmark

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: real-repo-benchmark
  cancel-in-progress: false

jobs:
  benchmark:
    name: Scan pinned repositories
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Scan pinned repositories against their budgets
        run: node scripts/real-repo-benchmark.mjs run --output "$RUNNER_TEMP/real-repo-benchmark.json"

      - name: Upload the benchmark report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: real-repo-benchmark
          path: ${{ runner.temp }}/real-repo-benchmark.json
          if-no-files-found: ignore
          retention-days: 30
