name: CARTOGRAPH architecture diff
description: Read-only pull-request architecture diff with a static report artifact
author: Alisina Karimi
branding:
  icon: git-pull-request
  color: blue

inputs:
  root:
    description: Repository-relative root to analyze
    required: false
    default: .
  base:
    description: Explicit base Git ref or SHA; defaults to the pull-request base SHA
    required: false
    default: ""
  head:
    description: Explicit head Git ref or SHA; defaults to the pull-request head SHA
    required: false
    default: ""
  comparison:
    description: Revision comparison mode (merge-base is the pull-request default)
    required: false
    default: merge-base
  artifact-name:
    description: Name of the uploaded static report artifact
    required: false
    default: cartograph-architecture-diff
  retention-days:
    description: Number of days to retain the report artifact (1-90)
    required: false
    default: "7"
  upload-report:
    description: Upload the JSON and HTML report artifact; set false for sensitive repositories
    required: false
    default: "true"
  policy:
    description: Repository-relative local policy JSON; leave empty to skip policy evaluation
    required: false
    default: ""
  policy-mode:
    description: Policy CI mode; informational is the non-blocking default and enforce is opt-in
    required: false
    default: informational
  review-context:
    description: Optional repository-relative JSON context for lifecycle, ownership, waiver, and ADR review output
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24.x

    - name: Build CARTOGRAPH
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        set -euo pipefail
        npm ci --ignore-scripts
        npm run build

    - name: Analyze pull-request revisions
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        CARTOGRAPH_ACTION_PATH: ${{ github.action_path }}
        CARTOGRAPH_ROOT: ${{ inputs.root }}
        CARTOGRAPH_BASE_INPUT: ${{ inputs.base }}
        CARTOGRAPH_HEAD_INPUT: ${{ inputs.head }}
        CARTOGRAPH_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        CARTOGRAPH_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        CARTOGRAPH_COMPARISON: ${{ inputs.comparison }}
        CARTOGRAPH_ARTIFACT_NAME: ${{ inputs.artifact-name }}
        CARTOGRAPH_RETENTION_DAYS: ${{ inputs.retention-days }}
        CARTOGRAPH_UPLOAD_REPORT: ${{ inputs.upload-report }}
        CARTOGRAPH_POLICY_PATH: ${{ inputs.policy }}
        CARTOGRAPH_POLICY_MODE: ${{ inputs.policy-mode }}
        CARTOGRAPH_REVIEW_CONTEXT_PATH: ${{ inputs.review-context }}
      run: |
        set -euo pipefail
        base_ref="${CARTOGRAPH_BASE_INPUT:-${CARTOGRAPH_PR_BASE_SHA:-}}"
        head_ref="${CARTOGRAPH_HEAD_INPUT:-${CARTOGRAPH_PR_HEAD_SHA:-}}"
        if [[ -z "$base_ref" || -z "$head_ref" ]]; then
          echo "CARTOGRAPH requires a pull_request event or explicit base and head inputs" >&2
          exit 1
        fi
        case "$CARTOGRAPH_COMPARISON" in
          direct|merge-base) ;;
          *)
            echo "CARTOGRAPH comparison must be direct or merge-base" >&2
            exit 1
            ;;
        esac
        if [[ ! "$CARTOGRAPH_RETENTION_DAYS" =~ ^([1-9]|[1-8][0-9]|90)$ ]]; then
          echo "CARTOGRAPH retention-days must be an integer from 1 through 90" >&2
          exit 1
        fi
        case "$CARTOGRAPH_UPLOAD_REPORT" in
          true|false) ;;
          *)
            echo "CARTOGRAPH upload-report must be true or false" >&2
            exit 1
            ;;
        esac
        case "$CARTOGRAPH_POLICY_MODE" in
          informational|enforce) ;;
          *)
            echo "CARTOGRAPH policy-mode must be informational or enforce" >&2
            exit 1
            ;;
        esac

        report_dir="$RUNNER_TEMP/cartograph-report"
        mkdir -p "$report_dir"
        node "$CARTOGRAPH_ACTION_PATH/dist/cli.js" diff "$CARTOGRAPH_ROOT" \
          --base "$base_ref" \
          --head "$head_ref" \
          --comparison "$CARTOGRAPH_COMPARISON" \
          --format json \
          --output "$report_dir/architecture-diff.json" \
          --force
        policy_exit=0
        if [[ -n "$CARTOGRAPH_POLICY_PATH" ]]; then
          set +e
          node "$CARTOGRAPH_ACTION_PATH/dist/cli.js" policy "$CARTOGRAPH_ROOT" \
            --policy "$CARTOGRAPH_POLICY_PATH" \
            --diff "$report_dir/architecture-diff.json" \
            --mode "$CARTOGRAPH_POLICY_MODE" \
            --output "$report_dir/policy-evaluation.json" \
            --force
          policy_exit=$?
          set -e
        fi
        printf '%s\n' "$policy_exit" > "$report_dir/policy-exit-code"
        node "$CARTOGRAPH_ACTION_PATH/scripts/action-report.mjs" \
          "$report_dir/architecture-diff.json" \
          "$report_dir/architecture-diff.html" \
          "${GITHUB_STEP_SUMMARY:-}" \
          "$CARTOGRAPH_ARTIFACT_NAME" \
          "$CARTOGRAPH_UPLOAD_REPORT" \
          "$report_dir/policy-evaluation.json" \
          "$CARTOGRAPH_REVIEW_CONTEXT_PATH" \
          "$report_dir/architecture-review.json" \
          "$report_dir/architecture-review.html"

    - name: Upload architecture diff report
      if: inputs.upload-report == 'true'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: ${{ inputs.artifact-name }}
        path: |
          ${{ runner.temp }}/cartograph-report/architecture-diff.json
          ${{ runner.temp }}/cartograph-report/architecture-diff.html
          ${{ runner.temp }}/cartograph-report/architecture-review.json
          ${{ runner.temp }}/cartograph-report/architecture-review.html
        if-no-files-found: error
        retention-days: ${{ inputs.retention-days }}

    - name: Upload policy evaluation
      if: inputs.upload-report == 'true' && inputs.policy != ''
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: ${{ inputs.artifact-name }}-policy
        path: ${{ runner.temp }}/cartograph-report/policy-evaluation.json
        if-no-files-found: error
        retention-days: ${{ inputs.retention-days }}

    - name: Apply policy exit status
      if: always()
      shell: bash
      run: |
        set -euo pipefail
        status_file="$RUNNER_TEMP/cartograph-report/policy-exit-code"
        if [[ ! -f "$status_file" ]]; then
          exit 0
        fi
        read -r policy_exit < "$status_file"
        case "$policy_exit" in
          0) exit 0 ;;
          1|2) exit "$policy_exit" ;;
          *) echo "CARTOGRAPH policy command returned an invalid status" >&2; exit 1 ;;
        esac
