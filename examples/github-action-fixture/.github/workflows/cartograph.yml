name: CARTOGRAPH architecture diff

on:
  # Deliberately use pull_request: fork runs receive a read-only token and no
  # repository secrets; do not elevate this trigger to a target-context event.
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: cartograph-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  architecture:
    name: Architecture diff
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out pull-request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Run CARTOGRAPH
        uses: AlisinaDevelo/CARTOGRAPH@0491e7cdd8a558b025fc60a3897a01cf74577965 # self-Action metadata verified
        with:
          comparison: merge-base
          artifact-name: cartograph-architecture-diff
